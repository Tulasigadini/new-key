<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Chat App</title>
    <style>
      /* Completely prevent body/html scrolling */
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        position: fixed;
        overflow: hidden;
      }
      
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        position: fixed;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        position: fixed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
